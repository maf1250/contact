<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { 
            font-family: 'Cairo', sans-serif; 
            box-sizing: border-box; 
        }
        
        body { 
            background-color: #f4f9f8; 
            color: #333; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; /* توسيط عمودي */
            min-height: 100vh;
        }
        
        .contact-container { 
            background-color: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            max-width: 600px; /* عرض مناسب لنموذج المراسلة */
            width: 100%; 
            position: relative; 
            border-top: 4px solid #008e7e;
        }
        
        h1 { 
            text-align: center; 
            color: #008e7e; 
            font-size: 24px; 
            margin-top: 0;
            margin-bottom: 25px; 
        }

        .contact-form-group { 
            margin-bottom: 15px; 
            text-align: right; 
        }
        
        .contact-form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #006d60; 
        }
        
        .contact-form-group input, 
        .contact-form-group select, 
        .contact-form-group textarea {
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbe6e3; 
            border-radius: 6px;
            font-family: inherit; 
            font-size: 14px; 
            outline: none; 
            transition: 0.3s;
            background-color: #fafdfa;
        }
        
        .contact-form-group input:focus, 
        .contact-form-group select:focus, 
        .contact-form-group textarea:focus {
            box-shadow: 0 0 8px rgba(0, 142, 126, 0.3); 
            border-color: #008e7e;
            background-color: #fff;
        }

        .btn-process { 
            background-color: #008e7e; 
            color: #fff; 
            border: none; 
            padding: 15px 20px; 
            width: 100%; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        
        .btn-process:hover { 
            background-color: #006d60; 
        }
        
        .btn-process:disabled { 
            background-color: #a0c9c4; 
            cursor: not-allowed; 
        }
        
        #contact_status {
            margin-top: 15px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>تواصل معنا</h1>
        
        <form id="contactForm" onsubmit="submitContactForm(event)">
            <input type="hidden" name="access_key" value="54190f55-c3e4-41b4-b772-9a62ae475b49">
            <input type="hidden" name="subject" value="رسالة جديدة من الموقع الرئيسي">
            
            <div class="contact-form-group">
                <label>الاسم</label>
                <input type="text" name="الاسم" required placeholder="نأمل كتابة اسمك هنا">
            </div>
            
            <div class="contact-form-group">
                <label>وسيلة التواصل</label>
                <input type="text" name="وسيلة التواصل" required placeholder="البريد الإلكتروني أو رقم الجوال للتواصل معك">
            </div>
            
            <div class="contact-form-group">
                <label>نوع الرسالة</label>
                <select name="نوع الرسالة">
                    <option value="اقتراح">اقتراح تطوير</option>
                    <option value="مشكلة">الإبلاغ عن مشكلة</option>
                    <option value="استفسار">استفسار</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>
            
            <div class="contact-form-group">
                <label>نص الرسالة</label>
                <textarea name="الرسالة" required rows="5" placeholder="نأمل كتابة رسالتك أو ملاحظتك هنا..."></textarea>
            </div>
            
            <button type="submit" class="btn-process" id="contact_submit_btn">إرسال الرسالة</button>
            <div id="contact_status"></div>
        </form>
    </div>

    <script>
        async function submitContactForm(event) {
            event.preventDefault(); 
            const form = event.target;
            const submitBtn = document.getElementById('contact_submit_btn');
            const statusDiv = document.getElementById('contact_status');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'جار الإرسال...';
            statusDiv.innerText = '';
            statusDiv.style.color = '#006d60';

            const formData = new FormData(form);

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerText = '✅ تم إرسال رسالتك بنجاح، شكراً لتواصلك!';
                    statusDiv.style.color = '#008e7e';
                    form.reset(); // تفريغ الحقول بعد الإرسال
                } else {
                    statusDiv.innerText = '❌ حدث خطأ أثناء الإرسال، نأمل المحاولة لاحقاً.';
                    statusDiv.style.color = '#dc3545';
                }
            } catch (error) {
                statusDiv.innerText = '❌ نأمل التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى.';
                statusDiv.style.color = '#dc3545';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال الرسالة';
            }
        }
    </script>
</body>
</html>
